<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh Sách Sản Phẩm - Flexbox Layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1 class="page-title">Danh Sách Sản Phẩm Nổi Bật</h1>

    <!-- Container chứa danh sách sản phẩm sử dụng Flexbox -->
    <div class="products">

      <!-- Thẻ sản phẩm 1 -->
      <div class="product">
        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=500&auto=format&fit=crop" alt="Tai nghe Bluetooth">
        <div class="product-info">
          <h3 class="product-name">Tai nghe Bluetooth Cao Cấp</h3>
          <p class="price">1.250.000 đ</p>
          <button class="buy-btn">Mua ngay</button>
        </div>
      </div>

      <!-- Thẻ sản phẩm 2 -->
      <div class="product">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=500&auto=format&fit=crop" alt="Đồng hồ Thông minh">
        <div class="product-info">
          <h3 class="product-name">Đồng Hồ Thông Minh Sport</h3>
          <p class="price">2.490.000 đ</p>
          <button class="buy-btn">Mua ngay</button>
        </div>
      </div>

      <!-- Thẻ sản phẩm 3 -->
      <div class="product">
        <img src="https://images.unsplash.com/photo-1585386959984-a4155224a1ad?q=80&w=500&auto=format&fit=crop" alt="Nước hoa Unisex">
        <div class="product-info">
          <h3 class="product-name">Nước Hoa EDT 100ml</h3>
          <p class="price">1.800.000 đ</p>
          <button class="buy-btn">Mua ngay</button>
        </div>
      </div>

      <!-- Thẻ sản phẩm 4 -->
      <div class="product">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=500&auto=format&fit=crop" alt="Giày Thể Thao">
        <div class="product-info">
          <h3 class="product-name">Giày Thể Thao Run Pro</h3>
          <p class="price">1.650.000 đ</p>
          <button class="buy-btn">Mua ngay</button>
        </div>
      </div>

      <!-- Thẻ sản phẩm 5 -->
      <div class="product">
        <img src="https://images.unsplash.com/photo-1560343090-f0409e92791a?q=80&w=500&auto=format&fit=crop" alt="Bàn phím Cơ">
        <div class="product-info">
          <h3 class="product-name">Bàn Phím Cơ Wireless</h3>
          <p class="price">1.100.000 đ</p>
          <button class="buy-btn">Mua ngay</button>
        </div>
      </div>

      <!-- Thẻ sản phẩm 6 -->
      <div class="product">
        <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?q=80&w=500&auto=format&fit=crop" alt="Máy ảnh Vintage">
        <div class="product-info">
          <h3 class="product-name">Máy Ảnh Retro Mini</h3>
          <p class="price">3.200.000 đ</p>
          <button class="buy-btn">Mua ngay</button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
